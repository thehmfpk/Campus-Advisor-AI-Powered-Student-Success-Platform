<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Campus Advisor — Your AI-Powered Campus Companion. Study smarter, build your career, discover opportunities, connect with your university community."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#3b52d6" />
    <meta property="og:title" content="Campus Advisor — Your AI-Powered Campus Companion" />
    <meta
      property="og:description"
      content="Study smarter. Build your career. Discover opportunities. Connect with your university community."
    />
    <meta property="og:type" content="website" />
    <title>Campus Advisor — Your AI-Powered Campus Companion</title>
    <script>
      // Apply persisted / system theme before paint to avoid flash.
      (function () {
        try {
          var stored = localStorage.getItem('ca-theme');
          var theme =
            stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
